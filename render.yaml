services:
  - type: web
    name: zaynor-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://zaynor-seven.vercel.app,null"
      - key: DEBUG
        value: "false"
      - key: RATE_LIMIT_ENABLED
        value: "false"

databases:
  - name: zaynor-db
    plan: free
    databaseName: zaynor
