<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order | ZAYNOR</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .track-section {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6rem 1.5rem 4rem;
        }
        .track-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        .track-card h1 {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }
        .track-card .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .track-card .form-group {
            text-align: left;
            margin-bottom: 1.25rem;
        }
        .track-card label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .track-card input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 0.9rem;
            transition: border-color var(--transition-fast);
        }
        .track-card input:focus {
            outline: none;
            border-color: var(--gold-primary);
        }
        .track-error {
            color: #e74c3c;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
        }
        .track-error.visible { display: block; }

        /* Tracking result */
        .track-result { display: none; text-align: left; }
        .track-result.visible { display: block; }

        .track-result h2 {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            color: var(--gold-primary);
            margin-bottom: 1rem;
        }

        .track-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }
        .track-meta dt {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .track-meta dd {
            font-size: 0.95rem;
            color: var(--text-primary);
            margin: 0;
        }

        /* Status progress bar */
        .status-progress {
            display: flex;
            justify-content: space-between;
            margin: 1.5rem 0;
            position: relative;
        }
        .status-progress::before {
            content: '';
            position: absolute;
            top: 14px;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--bg-tertiary);
        }
        .status-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
            flex: 1;
        }
        .status-step .dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--bg-tertiary);
            border: 3px solid var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            transition: all 0.3s ease;
        }
        .status-step.completed .dot {
            background: var(--gold-primary);
            border-color: var(--gold-primary);
            color: var(--text-dark);
        }
        .status-step.active .dot {
            border-color: var(--gold-primary);
            color: var(--gold-primary);
            box-shadow: 0 0 12px rgba(197, 160, 89, 0.4);
        }
        .status-step .label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: capitalize;
        }
        .status-step.active .label,
        .status-step.completed .label {
            color: var(--gold-primary);
        }

        .track-items {
            list-style: none;
            border-top: 1px solid var(--border-light);
            padding-top: 1rem;
            margin-top: 1rem;
        }
        .track-items li {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border-light);
            font-size: 0.9rem;
        }
        .track-items .item-name { color: var(--text-primary); }
        .track-items .item-detail { color: var(--text-secondary); }

        .track-back {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--gold-primary);
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <nav class="navbar" aria-label="Main Navigation">
            <a href="index.html" class="logo">ZAYNOR<span>.</span></a>
            <button class="nav-toggle" aria-label="Toggle Navigation Menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="perfumes.html" class="nav-link">Perfumes</a></li>
                <li><a href="skincare.html" class="nav-link">Skin Care</a></li>
                <li><a href="about.html" class="nav-link">About</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
                <li><a href="tracking.html" class="nav-link active">Track Order</a></li>
                <li><a href="wishlist.html" class="nav-link">Wishlist</a></li>
            </ul>
        </nav>
    </header>

    <section class="track-section">
        <div class="track-card">
            <!-- Form -->
            <div id="track-form-wrap">
                <h1>Track Your Order</h1>
                <p class="subtitle">Enter your order ID and the email you used at checkout.</p>
                <form id="track-form">
                    <div class="form-group">
                        <label for="track-order-id">Order ID</label>
                        <input type="number" id="track-order-id" placeholder="e.g. 1" min="1" required>
                    </div>
                    <div class="form-group">
                        <label for="track-email">Email Address</label>
                        <input type="email" id="track-email" placeholder="you@example.com" required>
                    </div>
                    <div id="track-error" class="track-error"></div>
                    <button type="submit" class="btn btn-primary" style="width:100%;margin-top:0.5rem;">Track Order</button>
                </form>
            </div>

            <!-- Result -->
            <div id="track-result" class="track-result">
                <h2>Order #<span id="tr-id"></span></h2>

                <div class="status-progress" id="tr-progress"></div>

                <dl class="track-meta">
                    <div><dt>Status</dt><dd id="tr-status"></dd></div>
                    <div><dt>Date</dt><dd id="tr-date"></dd></div>
                    <div><dt>Total</dt><dd id="tr-total"></dd></div>
                    <div><dt>Customer</dt><dd id="tr-customer"></dd></div>
                </dl>

                <ul class="track-items" id="tr-items"></ul>

                <span class="track-back" id="track-back">Track another order</span>
            </div>
        </div>
    </section>

    <script>
    (function () {
        'use strict';
        var API = 'http://127.0.0.1:8000/api/v1';
        var STATUSES = ['pending', 'confirmed', 'shipped', 'delivered'];

        var form = document.getElementById('track-form');
        var formWrap = document.getElementById('track-form-wrap');
        var result = document.getElementById('track-result');
        var errorEl = document.getElementById('track-error');

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            errorEl.className = 'track-error';
            errorEl.textContent = '';

            var orderId = document.getElementById('track-order-id').value;
            var email = document.getElementById('track-email').value;

            fetch(API + '/orders/track?order_id=' + encodeURIComponent(orderId) + '&email=' + encodeURIComponent(email))
                .then(function (res) { return res.json().then(function (d) { return { ok: res.ok, data: d }; }); })
                .then(function (r) {
                    if (!r.ok) throw new Error(r.data.detail || 'Order not found');
                    showResult(r.data);
                })
                .catch(function (err) {
                    errorEl.textContent = err.message;
                    errorEl.className = 'track-error visible';
                });
        });

        function showResult(order) {
            formWrap.style.display = 'none';
            result.className = 'track-result visible';

            document.getElementById('tr-id').textContent = order.id;
            document.getElementById('tr-status').textContent = order.status;
            document.getElementById('tr-date').textContent = new Date(order.created_at).toLocaleDateString();
            document.getElementById('tr-total').textContent = Number(order.total).toLocaleString() + ' PKR';
            document.getElementById('tr-customer').textContent = order.customer_name;

            // Progress bar
            var progress = document.getElementById('tr-progress');
            progress.innerHTML = '';
            var currentIdx = STATUSES.indexOf(order.status);
            if (order.status === 'cancelled') currentIdx = -1;

            STATUSES.forEach(function (s, i) {
                var step = document.createElement('div');
                step.className = 'status-step';
                if (order.status === 'cancelled') {
                    step.className += '';
                } else if (i < currentIdx) {
                    step.className += ' completed';
                } else if (i === currentIdx) {
                    step.className += ' active';
                }
                var checkOrNum = i < currentIdx ? '\u2713' : (i + 1);
                step.innerHTML = '<span class="dot">' + checkOrNum + '</span><span class="label">' + s + '</span>';
                progress.appendChild(step);
            });

            if (order.status === 'cancelled') {
                progress.innerHTML = '<div style="width:100%;text-align:center;color:#e74c3c;font-weight:600;font-size:0.9rem;">Order Cancelled</div>';
            }

            // Items
            var items = document.getElementById('tr-items');
            items.innerHTML = '';
            order.items.forEach(function (item) {
                var li = document.createElement('li');
                li.innerHTML = '<span class="item-name">' + esc(item.product_name) + ' &times; ' + item.quantity + '</span>' +
                    '<span class="item-detail">' + Number(item.unit_price).toLocaleString() + ' PKR</span>';
                items.appendChild(li);
            });
        }

        document.getElementById('track-back').addEventListener('click', function () {
            formWrap.style.display = '';
            result.className = 'track-result';
            form.reset();
        });

        function esc(s) {
            if (!s) return '';
            var d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }
    })();
    </script>
</body>
</html>
