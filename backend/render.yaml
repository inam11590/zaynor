services:
  - type: web
    name: zaynor-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zaynor-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://zaynor-seven.vercel.app,null"
      - key: DEBUG
        value: "false"
      - key: RATE_LIMIT_ENABLED
        value: "false"

databases:
  - name: zaynor-db
    plan: free
    databaseName: zaynor
